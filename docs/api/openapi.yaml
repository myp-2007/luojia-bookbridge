openapi: 3.1.0
info:
  title: Luojia BookBridge API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/books:
    get:
      tags:
      - books
      summary: Read Books
      operationId: read_books_api_v1_books_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Q
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - books
      summary: Create New Book
      operationId: create_new_book_api_v1_books_post
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/books/{book_id}:
    get:
      tags:
      - books
      summary: Read Book
      operationId: read_book_api_v1_books__book_id__get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/books/{book_id}/images:
    get:
      tags:
      - books
      summary: Read Book Images
      operationId: read_book_images_api_v1_books__book_id__images_get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookImageRead'
                title: Response Read Book Images Api V1 Books  Book Id  Images Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - books
      summary: Upload Book Image
      operationId: upload_book_image_api_v1_books__book_id__images_post
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Book Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_book_image_api_v1_books__book_id__images_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookImageRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/books/{book_id}/publish:
    post:
      tags:
      - books
      summary: Publish Existing Book
      operationId: publish_existing_book_api_v1_books__book_id__publish_post
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Book Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/books/{book_id}/ai-extract:
    post:
      tags:
      - books
      summary: Recognize Book
      operationId: recognize_book_api_v1_books__book_id__ai_extract_post
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Book Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRecognitionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/books/{book_id}/reservations:
    post:
      tags:
      - reservations
      summary: Reserve Book
      operationId: reserve_book_api_v1_books__book_id__reservations_post
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Book Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reservations/mine:
    get:
      tags:
      - reservations
      summary: Read My Reservations
      operationId: read_my_reservations_api_v1_reservations_mine_get
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationRead'
                title: Response Read My Reservations Api V1 Reservations Mine Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reservations/{reservation_id}/confirm:
    post:
      tags:
      - reservations
      summary: Confirm Reservation
      operationId: confirm_reservation_api_v1_reservations__reservation_id__confirm_post
      parameters:
      - name: reservation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Reservation Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reservations/{reservation_id}/reject:
    post:
      tags:
      - reservations
      summary: Reject Reservation
      operationId: reject_reservation_api_v1_reservations__reservation_id__reject_post
      parameters:
      - name: reservation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Reservation Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reservations/{reservation_id}/cancel:
    post:
      tags:
      - reservations
      summary: Cancel Reservation
      operationId: cancel_reservation_api_v1_reservations__reservation_id__cancel_post
      parameters:
      - name: reservation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Reservation Id
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports:
    post:
      tags:
      - reports
      summary: Create Report
      operationId: create_report_api_v1_reports_post
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/mine:
    get:
      tags:
      - reports
      summary: Read My Reports
      operationId: read_my_reports_api_v1_reports_mine_get
      parameters:
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportRead'
                title: Response Read My Reports Api V1 Reports Mine Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/admin:
    get:
      tags:
      - reports
      summary: Read All Reports
      operationId: read_all_reports_api_v1_reports_admin_get
      parameters:
      - name: x-role
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportRead'
                title: Response Read All Reports Api V1 Reports Admin Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/admin/{report_id}/resolve:
    post:
      tags:
      - reports
      summary: Resolve Report
      operationId: resolve_report_api_v1_reports_admin__report_id__resolve_post
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      - name: x-role
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportResolve'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_book_image_api_v1_books__book_id__images_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_book_image_api_v1_books__book_id__images_post
    BookCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        author:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Author
        publisher:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Publisher
        edition:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Edition
        price:
          type: number
          minimum: 0.0
          title: Price
          default: 0
        condition:
          type: string
          maxLength: 40
          title: Condition
          default: 待填写
        hasNotes:
          type: boolean
          title: Hasnotes
          default: false
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        category:
          type: string
          title: Category
          default: textbook
        pickupPoint:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Pickuppoint
      type: object
      required:
      - title
      title: BookCreate
    BookImageRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        bookId:
          type: string
          format: uuid
          title: Bookid
        originalName:
          type: string
          title: Originalname
        contentType:
          type: string
          title: Contenttype
        sizeBytes:
          type: integer
          title: Sizebytes
        url:
          type: string
          title: Url
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - bookId
      - originalName
      - contentType
      - sizeBytes
      - url
      - createdAt
      title: BookImageRead
    BookListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BookRead'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        pageSize:
          type: integer
          title: Pagesize
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      title: BookListResponse
    BookRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        sellerId:
          type: string
          title: Sellerid
        title:
          type: string
          title: Title
        author:
          anyOf:
          - type: string
          - type: 'null'
          title: Author
        publisher:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher
        edition:
          anyOf:
          - type: string
          - type: 'null'
          title: Edition
        price:
          type: number
          title: Price
        condition:
          type: string
          title: Condition
        hasNotes:
          type: boolean
          title: Hasnotes
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        category:
          type: string
          title: Category
        status:
          type: string
          title: Status
        pickupPoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Pickuppoint
        aiStatus:
          type: string
          title: Aistatus
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - sellerId
      - title
      - author
      - publisher
      - edition
      - price
      - condition
      - hasNotes
      - description
      - category
      - status
      - pickupPoint
      - aiStatus
      - createdAt
      title: BookRead
    BookRecognitionRead:
      properties:
        title:
          $ref: '#/components/schemas/RecognitionFieldRead'
        author:
          $ref: '#/components/schemas/RecognitionFieldRead'
        publisher:
          $ref: '#/components/schemas/RecognitionFieldRead'
        edition:
          $ref: '#/components/schemas/RecognitionFieldRead'
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        provider:
          type: string
          title: Provider
      type: object
      required:
      - title
      - author
      - publisher
      - edition
      - warnings
      - provider
      title: BookRecognitionRead
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RecognitionFieldRead:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        confidence:
          type: number
          title: Confidence
      type: object
      required:
      - value
      - confidence
      title: RecognitionFieldRead
    ReportCreate:
      properties:
        targetType:
          type: string
          maxLength: 40
          minLength: 1
          title: Targettype
        targetId:
          type: string
          maxLength: 120
          minLength: 1
          title: Targetid
        reason:
          type: string
          maxLength: 80
          minLength: 1
          title: Reason
        description:
          type: string
          maxLength: 2000
          minLength: 1
          title: Description
      type: object
      required:
      - targetType
      - targetId
      - reason
      - description
      title: ReportCreate
    ReportRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        reporterId:
          type: string
          title: Reporterid
        targetType:
          type: string
          title: Targettype
        targetId:
          type: string
          title: Targetid
        reason:
          type: string
          title: Reason
        description:
          type: string
          title: Description
        status:
          type: string
          title: Status
        handlerId:
          anyOf:
          - type: string
          - type: 'null'
          title: Handlerid
        resolution:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution
        createdAt:
          type: string
          format: date-time
          title: Createdat
        resolvedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolvedat
      type: object
      required:
      - id
      - reporterId
      - targetType
      - targetId
      - reason
      - description
      - status
      - handlerId
      - resolution
      - createdAt
      - resolvedAt
      title: ReportRead
    ReportResolve:
      properties:
        status:
          type: string
          pattern: ^(resolved|rejected)$
          title: Status
        resolution:
          type: string
          maxLength: 2000
          minLength: 1
          title: Resolution
      type: object
      required:
      - status
      - resolution
      title: ReportResolve
    ReservationCreate:
      properties:
        pickupPoint:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Pickuppoint
        proposedTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Proposedtime
      type: object
      title: ReservationCreate
    ReservationRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        bookId:
          type: string
          format: uuid
          title: Bookid
        buyerId:
          type: string
          title: Buyerid
        status:
          type: string
          title: Status
        pickupPoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Pickuppoint
        proposedTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Proposedtime
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expiresat
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - bookId
      - buyerId
      - status
      - pickupPoint
      - proposedTime
      - expiresAt
      - createdAt
      title: ReservationRead
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
