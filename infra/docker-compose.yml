services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookbridge
      POSTGRES_USER: bookbridge
      POSTGRES_PASSWORD: bookbridge
    ports:
      - "5432:5432"
    volumes:
      - bookbridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbridge -d bookbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://bookbridge:bookbridge@db:5432/bookbridge
      ALLOW_DEV_AUTH: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - bookbridge-storage:/app/storage
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  bookbridge-db:
  bookbridge-storage:
